services:
  frontend:
    image: scip
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REACT_APP_VERSION: ${REACT_APP_VERSION:-}
    container_name: scip
    ports:
      - "3000:3000"
    volumes:
      - type: bind
        source: ${SCIP_CONFIG_FILE:-../public/config.js}
        target: /usr/share/nginx/html/config.js
        read_only: true
        bind:
          create_host_path: false
